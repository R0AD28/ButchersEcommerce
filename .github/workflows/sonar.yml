name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mantenemos tu paso de la inyección de la llave privada de pruebas
      - name: Create PEM key directory and file
        run: |
          mkdir -p backend/auth-service/src/test/resources/test-keys
          echo "${{ secrets.TEST_PRIVATE_KEY }}" > backend/auth-service/src/test/resources/test-keys/private-key.pem

      # CORREGIDO: Subido a Java 21 para que compile el código del microservicio
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # CORREGIDO: Se inyectan los parámetros obligatorios y la ruta del pom.xml
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=false \
            -DskipTests \
            -Dmaven.test.skip=true \
            -f backend/auth-service/pom.xml
