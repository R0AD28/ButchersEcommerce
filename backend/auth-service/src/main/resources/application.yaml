spring:

  application:
    name: auth-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s


server:
  port: ${SERVER_PORT:8081}

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never


security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:file:./secrets/private-key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:./secrets/public-key.pem}
    issuer: ${JWT_ISSUER:auth-service}
    audience: ${JWT_AUDIENCE:butchers-ecommerce}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}

  login:
    max-attempts: 5
    lock-duration-minutes: 15

  refresh-token:
    expiration-days: 7

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
    path: /auth

  authorization-cache:
    ttl-seconds: 30

  internal-services:
    tokens:
      catalog-service: ${CATALOG_SERVICE_TOKEN}
      commerce-service: ${COMMERCE_SERVICE_TOKEN}
      support-service: ${SUPPORT_SERVICE_TOKEN}
      audit-service: ${AUDIT_SERVICE_TOKEN}

  services:
    audit:
      url: ${AUDIT_SERVICE_URL:http://audit-service:8085}
      name: auth-service
      token: ${AUTH_SERVICE_TOKEN}
  
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  rate-limit:
    login-requests: ${RATE_LIMIT_LOGIN_REQUESTS:10}
    register-requests: ${RATE_LIMIT_REGISTER_REQUESTS:5}
    refresh-requests: ${RATE_LIMIT_REFRESH_REQUESTS:20}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}


management:

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never


logging:

  level:
    root: INFO
    com.ecommerce.auth_service: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

app:

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}