spring:
  main:
    allow-bean-definition-overriding: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

security:
  jwt:
    public-key-path: classpath:test-keys/public-key.pem
    issuer: auth-service-test
    audience: butchers-ecommerce-test

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

  services:
    auth:
      url: http://localhost:8081
      authorization-path: /internal/authorization/me
      service-name: commerce-service-test
      service-token: test-catalog-token

    audit:
      url: http://localhost:8085
      service-name: commerce-service-test
      service-token: test-catalog-token