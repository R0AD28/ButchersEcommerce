spring:
  application:
    name: commerce-service
  datasource:
    url: ${DB_URL_COMMERCE:jdbc:postgresql://localhost:5434/commerce_db}
    username: ${DB_USER_COMMERCE:ecommerce_commerce}
    password: ${DB_PASSWORD_COMMERCE:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8084}
  error:
    include-message: never
    include-stacktrace: never

clients:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}

security:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:./secrets/public-key.pem}
    issuer: ${JWT_ISSUER:auth-service}
    audience: ${JWT_AUDIENCE:butchers-ecommerce}
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  services:
    auth:
      url: ${AUTH_SERVICE_URL:http://auth-service:8081}
      authorization-path: /internal/authorization/me
      service-name: commerce-service
      service-token: ${COMMERCE_SERVICE_TOKEN:change-me}
    audit:
      url: ${AUDIT_SERVICE_URL:http://audit-service:8085}
      service-name: commerce-service
      service-token: ${COMMERCE_SERVICE_TOKEN:change-me}
  rate-limit:
    read-requests: ${RATE_LIMIT_READ_REQUESTS:100}
    write-requests: ${RATE_LIMIT_WRITE_REQUESTS:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  http-client:
    connect-timeout-millis: ${HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-millis: ${HTTP_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
