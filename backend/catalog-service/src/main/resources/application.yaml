spring:
  application:
    name: catalog-service

  datasource:
    url: ${DB_URL_CATALOG:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${DB_USER_CATALOG:ecommerce_catalog}
    password: ${DB_PASSWORD_CATALOG:change-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

security:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:./secrets/public-key.pem}
    issuer: ${JWT_ISSUER:auth-service}
    audience: ${JWT_AUDIENCE:butchers-ecommerce}

  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  services:
    auth:
      url: ${AUTH_SERVICE_URL:http://auth-service:8081}
      authorization-path: /internal/authorization/me
      service-name: catalog-service
      service-token: ${CATALOG_SERVICE_TOKEN}

    audit:
      url: ${AUDIT_SERVICE_URL:http://audit-service:8085}
      service-name: catalog-service
      service-token: ${CATALOG_SERVICE_TOKEN}
    
    rate-limit:
    read-requests: ${RATE_LIMIT_READ_REQUESTS:100}
    write-requests: ${RATE_LIMIT_WRITE_REQUESTS:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

    idempotency:
      ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}

    http-client:
      connect-timeout-millis: ${HTTP_CONNECT_TIMEOUT_MS:2000}
      read-timeout-millis: ${HTTP_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ecommerce.catalog_service: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
