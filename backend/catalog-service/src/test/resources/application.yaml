spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

security:
  jwt:
    public-key-path: classpath:test-keys/public-key.pem
    issuer: auth-service-test
    audience: butchers-ecommerce-test
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  services:
    auth:
      url: http://localhost:18081
      authorization-path: /internal/authorization/me
      service-name: catalog-service-test
      service-token: test-catalog-token
    audit:
      url: http://localhost:18085
      service-name: catalog-service-test
      service-token: test-catalog-token
      outbox-delay-ms: 3600000
  rate-limit:
    read-requests: 1000
    write-requests: 1000
    window-seconds: 60
  idempotency:
    ttl-hours: 24
  http-client:
    connect-timeout-millis: 1000
    read-timeout-millis: 1000
